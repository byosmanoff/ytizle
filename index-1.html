<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#150a1d">
<title>Birlikdə İzlə</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --velvet:#150a1d; --velvet-2:#1e1029; --seat:#2a1739; --seat-2:#37204a;
  --rose:#ff7a9c; --rose-deep:#e8567d; --amber:#ffc46b;
  --paper:#f8e7e1; --ink:#2b0f26; --ink-soft:#7a5469;
  --text:#f6ecf7; --muted:#b7a2cf; --line:rgba(255,255,255,.09);
  --font:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--velvet);color:var(--text);font-family:var(--font);
  font-size:16px;line-height:1.35;display:flex;flex-direction:column;height:100dvh;
  -webkit-tap-highlight-color:transparent;overflow:hidden;
}
button,input{font:inherit;font-size:16px;border:0;color:inherit}
button{cursor:pointer;transition:transform .12s ease,background-color .15s ease,opacity .15s ease}
button:active:not(:disabled){transform:scale(.96)}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
input{outline:none}

/* ================= JOIN: the ticket ================= */
#join{
  position:relative;margin:0;flex:1;display:flex;align-items:center;justify-content:center;
  padding:20px 16px;overflow-y:auto;text-align:left;
  background:
    radial-gradient(120% 70% at 50% -10%, rgba(255,196,107,.20), transparent 60%),
    radial-gradient(90% 60% at 50% 120%, rgba(232,86,125,.22), transparent 60%),
    var(--velvet);
}
.ticket{width:min(100%,360px);margin:auto;filter:drop-shadow(0 24px 40px rgba(0,0,0,.55))}
.t-main,.t-stub{background:var(--paper);color:var(--ink);padding:24px 22px;position:relative}
.t-main{
  border-radius:22px 22px 0 0;
  -webkit-mask:radial-gradient(circle 12px at 0 100%,transparent 11.5px,#000 12px) left/50.5% 100% no-repeat,
               radial-gradient(circle 12px at 100% 100%,transparent 11.5px,#000 12px) right/50.5% 100% no-repeat;
          mask:radial-gradient(circle 12px at 0 100%,transparent 11.5px,#000 12px) left/50.5% 100% no-repeat,
               radial-gradient(circle 12px at 100% 100%,transparent 11.5px,#000 12px) right/50.5% 100% no-repeat;
}
.t-stub{
  border-radius:0 0 22px 22px;padding-top:26px;
  -webkit-mask:radial-gradient(circle 12px at 0 0,transparent 11.5px,#000 12px) left/50.5% 100% no-repeat,
               radial-gradient(circle 12px at 100% 0,transparent 11.5px,#000 12px) right/50.5% 100% no-repeat;
          mask:radial-gradient(circle 12px at 0 0,transparent 11.5px,#000 12px) left/50.5% 100% no-repeat,
               radial-gradient(circle 12px at 100% 0,transparent 11.5px,#000 12px) right/50.5% 100% no-repeat;
}
.t-stub::before{ /* perforation */
  content:"";position:absolute;left:22px;right:22px;top:-1px;
  border-top:2px dashed rgba(43,15,38,.28);
}
.pair{display:block;width:44px;height:46px;margin-bottom:12px}
#join h1{font-size:40px;line-height:.98;font-weight:800;letter-spacing:-.02em;margin:0 0 8px;font-variation-settings:"wdth" 85}
.tagline{color:var(--ink-soft);font-size:15px;margin-bottom:20px}
.field{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px}
#join input{
  width:100%;margin:0 0 12px;padding:13px 14px;border-radius:12px;
  background:#fff7f4;color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(43,15,38,.16);
  transition:box-shadow .15s ease;
}
#join input::placeholder{color:#b49aa9}
#join input:focus{box-shadow:inset 0 0 0 2px var(--rose-deep)}
#join button{width:100%;padding:14px;border-radius:12px;font-weight:700}
#create{background:var(--rose-deep);color:#fff}
#create:hover:not(:disabled){background:#d94870}
#join button.alt{background:var(--ink);color:var(--paper)}
#join button.alt:hover:not(:disabled){background:#43203a}
.or{margin:0 0 14px;color:var(--ink);font-size:15px;font-weight:600}
#codein{
  text-align:center;letter-spacing:.45em;text-indent:.45em;text-transform:uppercase;
  font-weight:800;font-size:22px;padding:12px 14px;
}
#joinmsg{margin-top:12px;font-size:14px;color:#b02a52;min-height:18px;font-weight:500}

/* ================= APP shell ================= */
#app{display:none;flex-direction:column;height:100dvh;
  background:radial-gradient(100% 40% at 50% 0,rgba(255,196,107,.07),transparent 70%),var(--velvet)}

/* top bar */
#top{display:flex;align-items:center;gap:10px;padding:10px 12px 6px 16px;flex:none}
#status{
  flex:1;min-width:0;font-size:14px;font-weight:600;color:var(--muted);line-height:1.25;
  display:flex;align-items:center;gap:8px;padding:0;background:none;text-align:left;
}
#status::before{
  content:"";flex:none;width:9px;height:9px;border-radius:50%;
  background:var(--seat-2);box-shadow:0 0 0 2px rgba(255,255,255,.08);
}
#status[data-on="1"]{color:var(--text)}
#status[data-on="1"]::before{background:var(--rose);box-shadow:0 0 0 2px rgba(255,122,156,.35),0 0 12px 2px rgba(255,122,156,.7)}
#codebar{
  display:flex;align-items:center;gap:4px;flex:none;padding:3px 4px 3px 12px;
  background:var(--paper);color:var(--ink);border-radius:999px;font-size:12px;font-weight:600;
}
#codebar b{font-size:16px;font-weight:800;letter-spacing:.2em;color:var(--ink);margin-right:2px}
#codebar button{
  padding:6px 9px;font-size:12px;font-weight:700;border-radius:999px;
  background:rgba(43,15,38,.1);color:var(--ink);
}
#codebar button:hover{background:rgba(43,15,38,.18)}
#codebar .lbl{display:none}

/* the screen */
#player{
  position:relative;flex:none;margin:4px 12px 0;width:auto;background:#000;border-radius:16px;overflow:hidden;
  box-shadow:0 0 0 1px var(--line),0 10px 50px -8px rgba(255,122,156,.38),0 0 90px -20px rgba(255,196,107,.35);
}
#ytbox{width:100%;aspect-ratio:16/9;display:none}
#ytbox iframe{width:100%;height:100%}
#vid{width:100%;max-height:45dvh;display:none;background:#000}
#web{display:none;width:100%;height:46dvh;border:0;background:#fff}
#ytres,#home{display:none;width:100%;height:46dvh;overflow-y:auto;background:var(--velvet-2);overscroll-behavior:contain}
#tap{
  display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:5;
  padding:14px 22px;font-size:17px;font-weight:700;border-radius:999px;
  background:var(--rose);color:var(--ink);box-shadow:0 8px 30px rgba(0,0,0,.6);
}
#tap:active{transform:translate(-50%,-50%) scale(.96)}
.big #web,.big #ytres,.big #home{height:76dvh}
.big #vid{max-height:70dvh}

/* home & search */
.hint{padding:18px 18px 8px;color:var(--muted);font-size:15px;line-height:1.5}
#home .hint{display:flex;flex-direction:column;gap:6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 14px 14px}
.tile{
  background:var(--seat);border-radius:16px;padding:18px 10px 16px;text-align:center;
  font-size:15px;font-weight:600;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line);
  transition:background-color .15s ease,transform .12s ease;
}
.tile:hover{background:var(--seat-2)}
.tile:active{transform:scale(.97)}
.tile span{display:grid;place-items:center;width:46px;height:46px;margin:0 auto 10px;border-radius:50%;background:var(--velvet);color:var(--rose)}
.tile span svg{width:22px;height:22px}
.r{display:flex;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;transition:background-color .15s ease}
.r:hover{background:var(--seat)}
.r img{width:132px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;flex:none;background:var(--seat)}
.r div{min-width:0;font-size:14px;line-height:1.3;font-weight:500}
.r small{display:block;margin-top:5px;color:var(--muted);font-size:12px;font-weight:400}

/* url bar */
.bar{display:flex;align-items:center;gap:6px;padding:10px 12px;flex:none;background:none}
.bar button{
  flex:none;display:grid;place-items:center;width:42px;height:42px;padding:0;border-radius:50%;
  background:var(--seat);color:var(--text);
}
.bar button:hover{background:var(--seat-2)}
.bar button svg{width:20px;height:20px}
.bar button.pink{background:var(--rose);color:var(--ink)}
.bar button.pink:hover{background:#ff93ae}
.bar input{
  margin:0;flex:1;min-width:0;height:42px;padding:0 16px;border-radius:999px;
  background:var(--seat);color:var(--text);box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .15s ease;
}
.bar input::placeholder{color:#8f7aa8}
.bar input:focus{box-shadow:inset 0 0 0 1.5px var(--rose)}

/* chat */
#chat{flex:1;min-height:0;overflow-y:auto;padding:4px 14px 10px;display:flex;flex-direction:column;gap:6px;overscroll-behavior:contain}
.m{max-width:80%;padding:8px 13px 9px;border-radius:18px 18px 18px 5px;background:var(--seat);word-break:break-word;font-size:15px;line-height:1.35}
.m b{display:block;font-size:12px;font-weight:700;color:var(--amber);margin-bottom:1px}
.m.me{align-self:flex-end;background:var(--rose);color:var(--ink);border-radius:18px 18px 5px 18px}
.m.me b{color:rgba(43,15,38,.65)}
.sys{align-self:center;font-size:12px;color:var(--muted);padding:2px 10px;border-radius:999px;background:rgba(255,255,255,.04)}
.composer{padding-bottom:max(10px,env(safe-area-inset-bottom))}

@media (prefers-reduced-motion:no-preference){
  .ticket{animation:drop .7s cubic-bezier(.2,.8,.2,1) both}
  @keyframes drop{from{opacity:0;transform:translateY(-26px) rotate(-1.5deg)}to{opacity:1;transform:none}}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:700px){
  #app{max-width:520px;margin:0 auto;width:100%}
}
@media (max-height:640px){
  #join h1{font-size:32px}.pair{display:none}.tagline{margin-bottom:12px}
}
</style>
</head>
<body>

<div id="join">
  <div class="ticket">
    <div class="t-main">
      <svg class="pair" viewBox="-1 -4 34 36" overflow="visible" aria-hidden="true"><path d="M16 28C4 19 1 12 1 8a7 7 0 0 1 15-3 7 7 0 0 1 15 3c0 4-3 11-15 20z" fill="#e8567d"/><path d="M13 9.5v10l8.5-5z" fill="var(--paper)"/></svg>
      <h1>Birlikdə İzlə</h1>
      <p class="tagline">Uzaqda olsanız da, eyni kadrdasınız.</p>
      <label class="field" for="name">Adın</label>
      <input id="name" placeholder="Məsələn, Aysel" maxlength="20" autocomplete="given-name">
      <button id="create">Otaq aç</button>
    </div>
    <div class="t-stub">
      <div class="or">Kodun var? Buradan gir</div>
      <input id="codein" placeholder="KOD" maxlength="12" autocapitalize="characters" autocomplete="off" aria-label="Otaq kodu">
      <button id="enter" class="alt">Kodla gir</button>
      <div id="joinmsg" role="status"></div>
    </div>
  </div>
</div>

<div id="app">
  <div id="top">
    <div id="status" data-on="0">Qoşulur...</div>
    <div id="codebar"><span class="lbl">Otaq kodu:</span> <b id="code"></b> <button id="copy">Kopyala</button> <button id="lock">Kilidlə</button></div>
  </div>
  <div id="player">
    <div id="ytbox"><div id="yt"></div></div>
    <video id="vid" controls playsinline></video>
    <iframe id="web" allow="autoplay; fullscreen; encrypted-media" allowfullscreen
      sandbox="allow-scripts allow-same-origin allow-forms allow-presentation"></iframe>
    <div id="ytres"></div>
    <div id="home"></div>
    <button id="tap">▶ Videonu başlat</button>
  </div>
  <div class="bar">
    <button id="back" aria-label="Geri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button id="homebtn" aria-label="Ana səhifə"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/></svg></button>
    <input id="url" placeholder="Link yaz və ya axtar..." enterkeyhint="go" autocapitalize="off" autocorrect="off">
    <button id="load" class="pink" aria-label="Aç"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></button>
    <button id="big" aria-label="Ekranı böyüt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 9l4-4 4 4"/><path d="M8 15l4 4 4-4"/></svg></button>
  </div>
  <div id="chat"></div>
  <div class="bar composer">
    <input id="msg" placeholder="Mesaj yaz..." autocomplete="off">
    <button id="send" class="pink" aria-label="Göndər"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l16-8-6 16-3-7z"/></svg></button>
  </div>
</div>

<script>window.__ytReady = false; window.onYouTubeIframeAPIReady = function(){ window.__ytReady = true; };</script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
const $ = id => document.getElementById(id);
let myName = 'Mən', kind = null, curUrl = null;
let yt = null, ytReady = false, ytIsReady = false, ytPending = null;
let ignoreUntil = 0, lastT = null, hls = null;
let wantPlay = false, lastRemote = {time: 0, at: 0};
let room = '', me = Math.random().toString(36).slice(2, 10);
let since = 0, pc = 0, connected = false, offline = false, sendQ = Promise.resolve();
let isLocked = false, roomEpoch = null, leader = false, remoteSt = null, navAt = 0, lastAt = 0;
const hist = [];
const vid = $('vid'), web = $('web');
function mute(ms){ ignoreUntil = Math.max(ignoreUntil, Date.now() + ms); }
function ignoring(){ return Date.now() < ignoreUntil; }

if(window.__ytReady || (window.YT && YT.Player)) ytReady = true;
window.onYouTubeIframeAPIReady = () => { ytReady = true; };

function setStatus(t){ $('status').textContent = t; $('status').dataset.on = connected ? '1' : '0'; }
function sysMsg(t){
  const d = document.createElement('div'); d.className = 'sys'; d.textContent = t;
  $('chat').appendChild(d); $('chat').scrollTop = 1e9;
}
function addMsg(name, text, mine){
  const d = document.createElement('div'); d.className = 'm' + (mine ? ' me' : '');
  const b = document.createElement('b'); b.textContent = name;
  const s = document.createElement('span'); s.textContent = text;
  d.appendChild(b); d.appendChild(s);
  $('chat').appendChild(d); $('chat').scrollTop = 1e9;
}

/* ---------- Server vasitəsilə əlaqə ---------- */
function send(o){
  if(!room) return;
  sendQ = sendQ.then(() => fetch('/api/send', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({room, id: me, msg: o})
  })).catch(() => {});
}

function refreshStatus(){
  setStatus(connected ? 'Birlikdəsiniz' : 'Sevgilini gözləyirəm...');
}

function updatePeers(n){
  pc = n;
  if(n > 0 && !connected){
    connected = true;
    setStatus('Birlikdəsiniz');
    sysMsg('Qarşı tərəf qoşuldu');
    if(curUrl) send({t:'load', url: curUrl, hello: true, at: navAt});
  } else if(n === 0 && connected){
    connected = false;
    setStatus('Sevgilini gözləyirəm...');
    sysMsg('Qarşı tərəf çıxdı');
  }
}

function handle(m){
  if(m.t === 'chat') addMsg(m.name, m.text, false);
  else if(m.t === 'load' && typeof m.url === 'string' && m.url){
    if(m.hello && (m.url === curUrl || (m.at || 0) <= navAt)) return;
    loadPage(m.url, true);
  }
  else if(m.t === 'wv'){
    if(kind === 'web' && web.contentWindow) web.contentWindow.postMessage({t:'cmd', e:m.e, time:m.time}, '*');
  }
  else applyRemote(m);
}

function updateLockUI(){ $('lock').textContent = isLocked ? 'Kilidli' : 'Kilidlə'; }
function applyLock(v){
  if(v === isLocked) return;
  isLocked = v; updateLockUI();
  sysMsg(v ? '🔒 Otaq kilidləndi, yeni nəfər girə bilməz' : '🔓 Otaq açıldı');
}
async function lockCall(v){
  try{
    const r = await fetch('/api/lock', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({room, id: me, locked: v})
    });
    if(!r.ok) throw new Error('lock ' + r.status);
    applyLock(!!(await r.json()).locked);
  }catch(e){ sysMsg('Kilid dəyişmədi, yenidən cəhd et'); }
}

async function pollLoop(){
  while(true){
    const ac = new AbortController();
    const to = setTimeout(() => ac.abort(), 35000); // server 20 san gözləyir; ondan uzun asılıbsa kəs
    try{
      const r = await fetch('/api/poll?room=' + encodeURIComponent(room) + '&id=' + me +
        '&since=' + since + '&pc=' + pc + '&lk=' + (isLocked ? 1 : 0), {cache: 'no-store', signal: ac.signal});
      if(r.status === 403){
        setStatus('Otaq kilidlidir, bu cihaz üzv deyil');
        sysMsg('Otaq kilidlənib, bu cihaz içəri buraxılmadı');
        return;
      }
      if(!r.ok) throw new Error('http ' + r.status);
      const d = await r.json();
      since = d.seq;
      if(offline){ offline = false; refreshStatus(); }
      if(roomEpoch !== null && d.epoch !== roomEpoch){
        roomEpoch = d.epoch;               // server yenidən başlayıb, kilid itib: bərpa et
        if(isLocked) lockCall(true);
      } else {
        roomEpoch = d.epoch;
        applyLock(!!d.locked);
      }
      (d.msgs || []).forEach(handle);
      updatePeers(d.peers);
    }catch(e){
      // connected/pc sıfırlanmır: əks halda hər qısa kəsilmədə səhifə qarşı tərəfdə yenidən yüklənir
      offline = true;
      setStatus('Əlaqə problemi, yenidən cəhd edilir...');
      await new Promise(res => setTimeout(res, 2000));
    }finally{
      clearTimeout(to);
    }
  }
}

/* ---------- Otaq aç / kodla gir ---------- */
function joinMsg(t){ $('joinmsg').textContent = t; }
function lockJoin(v){ $('create').disabled = v; $('enter').disabled = v; }

async function enterRoom(code, create){
  myName = $('name').value.trim() || 'Mən';
  lockJoin(true);
  joinMsg('Qoşulur... ilk dəfə 30-50 saniyə çəkə bilər');
  while(true){
    try{
      if(create){
        const rc = await fetch('/api/create', {method: 'POST'});
        if(!rc.ok) throw new Error('create ' + rc.status);
        code = (await rc.json()).room;
        create = false;
      }
      try{ const sv = localStorage.getItem('wt_me_' + code); if(sv) me = sv; }catch(e){}
      const r = await fetch('/api/join', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({room: code, id: me})
      });
      if(r.status === 404){
        joinMsg('Belə otaq tapılmadı. Kodu yoxla.');
        lockJoin(false);
        return;
      }
      if(r.status === 403){
        joinMsg('Otaq kilidlidir, girmək olmur.');
        lockJoin(false);
        return;
      }
      if(!r.ok) throw new Error('join ' + r.status);
      const d = await r.json();
      since = d.seq;
      roomEpoch = d.epoch;
      isLocked = !!d.locked;
      room = code;
      try{ localStorage.setItem('wt_me_' + code, me); }catch(e){}
      break;
    }catch(e){
      await new Promise(res => setTimeout(res, 2500));
    }
  }
  $('join').style.display = 'none';
  $('app').style.display = 'flex';
  $('code').textContent = room.toUpperCase();
  updateLockUI();
  showHome();
  setStatus('Sevgilini gözləyirəm...');
  pollLoop();
}

/* ---------- Link / axtarış ---------- */
function ytId(u){
  let x;
  try{ x = new URL(String(u)); }catch(e){ return null; }
  const h = x.hostname.toLowerCase().replace(/^(www|m)\./, '');
  let id = null;
  if(h === 'youtu.be') id = x.pathname.split('/')[1];
  else if(h === 'youtube.com' || h === 'youtube-nocookie.com'){
    const p = x.pathname.split('/');
    if(x.pathname === '/watch') id = x.searchParams.get('v');
    else if(['embed', 'shorts', 'live', 'v'].includes(p[1])) id = p[2];
  }
  return id && /^[\w-]{11}$/.test(id) ? id : null;
}
function norm(s){
  s = s.trim();
  if(!s) return null;
  if(/^https?:\/\//i.test(s)) return s;
  if(!/\s/.test(s) && /\.[a-z]{2,}(:\d+)?([\/?#]|$)/i.test(s)) return 'https://' + s;
  return 'https://www.google.com/search?q=' + encodeURIComponent(s);
}
function ytSearchFromUrl(raw){
  if(!/youtu\.?be|youtube\.com/i.test(raw)) return false;
  if(ytId(raw)) return false;
  let u;
  try{ u = new URL(/^https?:\/\//i.test(raw) ? raw : 'https://' + raw); }catch(e){ return false; }
  if(!/(^|\.)youtube\.com$/i.test(u.hostname)) return false;
  if(u.pathname === '/results'){ ytSearch(u.searchParams.get('search_query') || ''); return true; }
  if(u.pathname === '/' || u.pathname === ''){ ytSearch(''); return true; }
  return false;
}

/* ---------- Rejim ---------- */
function showMode(m){
  mute(700);
  lastT = null; remoteSt = null; leader = false;
  wantPlay = false;
  $('tap').style.display = 'none';
  if(m !== 'yt'){ try{ yt && yt.pauseVideo && ytIsReady && yt.pauseVideo(); }catch(e){} }
  if(m !== 'file'){
    vid.pause();
    if(hls){ hls.destroy(); hls = null; }
    vid.removeAttribute('src'); vid.load();
  }
  if(m !== 'web') web.src = 'about:blank';
  $('ytbox').style.display = m === 'yt' ? 'block' : 'none';
  vid.style.display = m === 'file' ? 'block' : 'none';
  web.style.display = m === 'web' ? 'block' : 'none';
  $('ytres').style.display = m === 'ytres' ? 'block' : 'none';
  $('home').style.display = m === 'home' ? 'block' : 'none';
  kind = m;
}
function setFile(url){
  if(hls){ hls.destroy(); hls = null; }
  if(/\.m3u8/i.test(url) && !vid.canPlayType('application/vnd.apple.mpegurl') && window.Hls && Hls.isSupported()){
    hls = new Hls(); hls.loadSource(url); hls.attachMedia(vid);
  } else {
    vid.src = url;
  }
}

/* ---------- Başlanğıc səhifə ---------- */
const TILES = [
  {i: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>', t: 'YouTube axtarışı', f: () => { ytSearch(''); $('url').value = 'yt '; $('url').focus(); }},
  {i: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>', t: 'Google', u: 'https://www.google.com/?hl=az'}
];
function showHome(){
  showMode('home');
  const box = $('home');
  box.textContent = '';
  const h = document.createElement('div'); h.className = 'hint';
  [
    'Sayt linki yaz: həmin sayta girir',
    'Adi söz yaz: internetdə axtarır',
    'yt söz yaz: YouTube-da axtarır. Məsələn: yt dəniz səsi'
  ].forEach(s => {
    const p = document.createElement('div'); p.textContent = s; h.appendChild(p);
  });
  box.appendChild(h);
  const g = document.createElement('div'); g.className = 'tiles';
  TILES.forEach(x => {
    const el = document.createElement('div'); el.className = 'tile';
    const ic = document.createElement('span'); ic.innerHTML = x.i;
    el.appendChild(ic); el.appendChild(document.createTextNode(x.t));
    el.onclick = () => { if(x.f) x.f(); else loadPage(x.u, false); };
    g.appendChild(el);
  });
  box.appendChild(g);
}

/* YouTube pleyeri: hazır olmamış gələn video növbəyə qoyulur */
function ytLoad(id){
  if(yt && ytIsReady){
    yt.loadVideoById(id);
  } else if(yt){
    ytPending = id;
  } else {
    yt = new YT.Player('yt', {
      videoId: id,
      playerVars: { playsinline: 1, rel: 0 },
      events: {
        onReady: () => {
          ytIsReady = true;
          if(ytPending){ yt.loadVideoById(ytPending); ytPending = null; }
        },
        onStateChange: ytState
      }
    });
  }
}

let ytSeq = 0;
async function ytSearch(q){
  const my = ++ytSeq;
  showMode('ytres');
  const box = $('ytres');
  box.scrollTop = 0;
  if(!q){
    box.innerHTML = '';
    box.className = '';
    const h = document.createElement('div'); h.className = 'hint';
    h.textContent = 'YouTube-da axtarmaq üçün yuxarıdakı xanaya yt və axtarış sözünü yaz. Məsələn: yt dəniz səsi';
    box.appendChild(h);
    return;
  }
  box.textContent = 'Axtarılır...';
  box.className = 'hint';
  try{
    const r = await fetch('/api/yt?q=' + encodeURIComponent(q));
    const d = await r.json();
    if(my !== ytSeq) return;
    if(!r.ok) throw new Error('yt ' + r.status);
    box.className = '';
    if(!Array.isArray(d) || !d.length){ box.className = 'hint'; box.textContent = 'Nəticə tapılmadı'; return; }
    box.textContent = '';
    d.forEach(v => {
      const el = document.createElement('div'); el.className = 'r';
      const img = document.createElement('img'); img.src = v.thumb; img.loading = 'lazy';
      const t = document.createElement('div'); t.textContent = v.title;
      const s = document.createElement('small'); s.textContent = v.channel + (v.len ? ' · ' + v.len : '');
      t.appendChild(s);
      el.appendChild(img); el.appendChild(t);
      el.onclick = () => loadPage('https://www.youtube.com/watch?v=' + v.id, false);
      box.appendChild(el);
    });
  }catch(e){
    if(my !== ytSeq) return;
    box.className = 'hint';
    box.textContent = 'Axtarış alınmadı, bir az sonra yenidən yoxla';
  }
}

let navSeq = 0;
function loadPage(url, remote, tries = 0){
  if(typeof url !== 'string' || !url) return;
  const my = tries ? navSeq : ++navSeq;
  const id = ytId(url);
  curUrl = url;
  navAt = Date.now();
  $('url').value = url;
  if(hist[hist.length - 1] !== url) hist.push(url);

  if(id){
    if(!ytReady){
      if(tries >= 20){ sysMsg('YouTube pleyeri yüklənmədi (bloklanmış ola bilər)'); return; }
      setTimeout(() => { if(my === navSeq) loadPage(url, remote, tries + 1); }, 500);
      return;
    }
    showMode('yt');
    ytLoad(id);
  } else if(/\.(mp4|webm|ogg|mov|m3u8)(\?|#|$)/i.test(url)){
    showMode('file');
    setFile(url);
  } else {
    showMode('web');
    web.src = '/p?u=' + encodeURIComponent(url);
  }
  if(!remote){ send({t:'load', url}); sysMsg('Səhifə açdın'); }
  else sysMsg('Səhifə dəyişdi');
}
function goBack(){
  if(kind === 'ytres' || kind === 'home'){
    if(hist.length) loadPage(hist[hist.length - 1], false);
    return;
  }
  if(hist.length < 2){ showHome(); return; }
  hist.pop();
  loadPage(hist.pop(), false);
}

/* ---------- Video sinxron (YouTube / fayl) ---------- */
function getTime(){ try{ return kind === 'yt' ? yt.getCurrentTime() : vid.currentTime; }catch(e){ return 0; } }
function seekTo(t){ try{ kind === 'yt' ? yt.seekTo(t, true) : (vid.currentTime = t); }catch(e){} }
function doPlay(){ try{ kind === 'yt' ? yt.playVideo() : vid.play(); }catch(e){} }
function doPause(){ try{ kind === 'yt' ? yt.pauseVideo() : vid.pause(); }catch(e){} }

function isPlaying(){
  try{ return kind === 'yt' ? yt.getPlayerState() === 1 : !vid.paused; }catch(e){ return false; }
}
/* Brauzer avtomatik oynatmanı bloklayıbsa, toxunma düyməsi göstər */
function checkPlaying(){
  if(!wantPlay || (kind !== 'yt' && kind !== 'file')) return;
  if(!isPlaying()) $('tap').style.display = 'block';
}
$('tap').onclick = () => {
  $('tap').style.display = 'none';
  mute(900);
  const t = lastRemote.time + (Date.now() - lastRemote.at) / 1000;
  if(Math.abs(getTime() - t) > 1.5) seekTo(t);
  doPlay();
};

/* Qarşı tərəfdən gələn əmrin əks-sədasını (echo) geri göndərmirik: vaxt+vəziyyət uyğundursa */
function isEcho(playing, time){
  if(!remoteSt || Date.now() - remoteSt.at > 6000) return false;
  const exp = remoteSt.time + (remoteSt.playing ? (Date.now() - remoteSt.at) / 1000 : 0);
  return remoteSt.playing === playing && Math.abs(time - exp) < 1.5;
}
function sendLocal(o){ leader = true; send(o); }

function applyRemote(m){
  if(kind !== 'yt' && kind !== 'file') return;
  mute(600);
  leader = false;
  lastT = null;
  const now = Date.now();
  if(m.t === 'play'){
    wantPlay = true;
    lastRemote = {time: m.time, at: now};
    remoteSt = {playing: true, time: m.time, at: now};
    if(Math.abs(getTime() - m.time) > 0.8) seekTo(m.time);
    doPlay();
    setTimeout(checkPlaying, 1500);
  }
  else if(m.t === 'pause'){
    wantPlay = false;
    $('tap').style.display = 'none';
    remoteSt = {playing: false, time: m.time, at: now};
    doPause();
    if(Math.abs(getTime() - m.time) > 0.5) seekTo(m.time);
  }
  else if(m.t === 'seek'){
    const pl = typeof m.playing === 'boolean' ? m.playing : isPlaying();
    wantPlay = pl;
    lastRemote = {time: m.time, at: now};
    remoteSt = {playing: pl, time: m.time, at: now};
    seekTo(m.time);
  }
  else if(m.t === 'sync' && m.playing){
    wantPlay = true;
    lastRemote = {time: m.time, at: now};
    remoteSt = {playing: true, time: m.time, at: now};
    if(Math.abs(getTime() - m.time) > 2) seekTo(m.time + 0.4);
    if(!isPlaying()){ doPlay(); setTimeout(checkPlaying, 1500); }
  }
}
function ytState(e){
  if(e.data === 1) $('tap').style.display = 'none';
  if(ignoring()) return;
  if(e.data !== 1 && e.data !== 2) return;
  const t = yt.getCurrentTime(), pl = e.data === 1;
  if(isEcho(pl, t)) return;
  sendLocal({t: pl ? 'play' : 'pause', time: t});
}
vid.addEventListener('playing', () => { $('tap').style.display = 'none'; });
['play', 'pause', 'seeked'].forEach(ev => vid.addEventListener(ev, () => {
  if(ignoring()) return;
  const pl = !vid.paused, t = vid.currentTime;
  if(isEcho(pl, t)) return;
  sendLocal(ev === 'seeked' ? {t: 'seek', time: t, playing: pl} : {t: ev, time: t});
}));

/* YouTube-da "seek" hadisəsi yoxdur: vaxtın gözlənilməz tullanmasını özümüz tuturuq (oynayanda da, pauzada da) */
setInterval(() => {
  if(kind !== 'yt' || !yt || !ytIsReady || !yt.getPlayerState) return;
  const st = yt.getPlayerState();
  if(st !== 1 && st !== 2){ lastT = null; return; }
  const t = yt.getCurrentTime(), now = Date.now();
  if(lastT !== null && !ignoring()){
    const rate = st === 1 ? (yt.getPlaybackRate ? yt.getPlaybackRate() : 1) : 0;
    const exp = lastT + (now - lastAt) / 1000 * rate;
    if(Math.abs(t - exp) > 1.2 && !isEcho(st === 1, t)) sendLocal({t: 'seek', time: t, playing: st === 1});
  }
  lastT = t; lastAt = now;
}, 500);

/* Aparıcı tərəf (son toxunan) hər 3 san vaxtı göndərir, digər tərəf 2 san-dən çox fərq olsa düzəldir */
setInterval(() => {
  if(!leader || !connected || ignoring() || (kind !== 'yt' && kind !== 'file') || !isPlaying()) return;
  send({t: 'sync', time: getTime(), playing: true});
}, 3000);

/* ---------- Veb səhifədən gələn hadisələr ---------- */
let autoNavs = [], autoWarned = false;
window.addEventListener('message', e => {
  const m = e.data;
  if(!m || kind !== 'web') return;
  if(m.t === 'nav' && m.url && e.source === web.contentWindow){
    if(!m.auto){ autoNavs = []; autoWarned = false; loadPage(m.url, false); return; }
    // Saytın öz skriptinin yönləndirməsi: qarşı tərəfə göndərilmir (o da eyni yönləndirməni özü edir),
    // qısa müddətdə 3-dən çox olarsa döngü sayılıb dayandırılır
    const now = Date.now();
    autoNavs = autoNavs.filter(t => now - t < 10000);
    if(m.url === curUrl) return;
    if(autoNavs.length >= 3){
      if(!autoWarned){ autoWarned = true; sysMsg('Sayt öz-özünə yönləndirir, dayandırıldı'); }
      return;
    }
    autoNavs.push(now);
    loadPage(m.url, true);
  }
  else if(m.t === 'v') send({t:'wv', e:m.e, time:m.time});
});

/* ---------- UI ---------- */
function openInput(){
  const raw = $('url').value.trim();
  if(!raw) return;
  const m = raw.match(/^(?:yt|youtube)\s+(.+)$/i);
  if(m){ ytSearch(m[1]); return; }
  if(ytSearchFromUrl(raw)) return;
  const u = norm(raw);
  if(u) loadPage(u, false);
}
function enterByCode(){
  const c = $('codein').value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '');
  if(!c){ joinMsg('Kodu yaz'); return; }
  enterRoom(c, false);
}
$('create').onclick = () => enterRoom(null, true);
$('enter').onclick = enterByCode;
$('codein').addEventListener('keydown', e => { if(e.key === 'Enter') enterByCode(); });
$('lock').onclick = () => lockCall(!isLocked);
$('copy').onclick = async () => {
  const c = room.toUpperCase();
  try{
    await navigator.clipboard.writeText(c);
    $('copy').textContent = 'Kopyalandı';
    setTimeout(() => { $('copy').textContent = 'Kopyala'; }, 1500);
  }catch(e){
    prompt('Kodu kopyala:', c);
  }
};
$('load').onclick = openInput;
$('back').onclick = goBack;
$('homebtn').onclick = showHome;
$('big').onclick = () => document.body.classList.toggle('big');
$('url').addEventListener('keydown', e => { if(e.key === 'Enter') openInput(); });
function sendChat(){
  const t = $('msg').value.trim();
  if(!t) return;
  addMsg(myName, t, true);
  send({t:'chat', name: myName, text: t});
  $('msg').value = '';
}
$('send').onclick = sendChat;
$('msg').addEventListener('keydown', e => { if(e.key === 'Enter') sendChat(); });
</script>
